<script>


/* =====================================================
   ประเภทบันทึกข้อความ
===================================================== */

const documentTypes = [

    "บันทึกข้อความขออนุญาตประชาสัมพันธ์",

    "บันทึกข้อความขออนุญาตใช้สถานที่",

    "บันทึกข้อความเชิญวิทยากร",

    "บันทึกข้อความขอเวลาเรียน",

    "บันทึกข้อความสรุปงบประมาณการดำเนินโครงการ",

    "บันทึกข้อความรายงานสรุปจำนวนผู้เข้าร่วมโครงการ",

    "บันทึกข้อความรายงานผลการดำเนินโครงการ",

    "บันทึกข้อความรายงานสรุปผลการดำเนินงานตามโครงการ",

    "บันทึกข้อความขออนุญาตเปลี่ยนสถานที่จัดโครงการ",

    "บันทึกข้อความขออนุญาตลงนามในเกียรติบัตร",

    "บันทึกข้อความขอเชิญเป็นประธานเปิดโครงการ",

    "บันทึกข้อความขออนุญาตผู้บังคับบัญชาพานักเรียนออกนอกสถานที่"

];


/* =====================================================
   หน่วยงาน
===================================================== */

const organizations = [

    {
        id:"aft",
        name:"องค์การนักวิชาชีพในอนาคตแห่งประเทศไทย"
    },

    {
        id:"electric",
        name:"ชมรมวิชาชีพช่างไฟฟ้ากำลัง"
    },

    {
        id:"auto",
        name:"ชมรมวิชาชีพช่างยนต์"
    },

    {
        id:"electronic",
        name:"ชมรมวิชาชีพช่างอิเล็กทรอนิกส์"
    },

    {
        id:"construction",
        name:"ชมรมวิชาชีพก่อสร้าง"
    },

    {
        id:"welding",
        name:"ชมรมวิชาชีพช่างเชื่อมโลหะ"
    },

    {
        id:"accounting",
        name:"ชมรมวิชาชีพการบัญชี"
    },

    {
        id:"digital",
        name:"ชมรมวิชาชีพเทคโนโลยีธุรกิจดิจิทัล"
    },

    {
        id:"sadao",
        name:"ชมรมวิชาชีพศูนย์ฝึกอบรมวิชาชีพอำเภอสะเดา"
    }

];


/* =====================================================
   เลขเริ่มต้น
===================================================== */

const START_NUMBER = 215;


/* =====================================================
   ตัวแปรระบบ
===================================================== */

let documents = [];

let editingId = null;

const STORAGE_KEY =
    "aft_chana_document_system_v3";


/* =====================================================
   โหลดข้อมูล
===================================================== */

function loadData(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(saved){

            documents =
                JSON.parse(saved);

        }

    }catch(error){

        documents = [];

    }

}


/* =====================================================
   บันทึกข้อมูล
===================================================== */

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(documents)
    );

}


/* =====================================================
   Escape HTML
===================================================== */

function escapeHTML(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   วันที่ไทย
===================================================== */

function formatThaiDate(input){

    let value =
        input.value.replace(/\D/g,"");


    if(value.length > 8){

        value =
            value.substring(0,8);

    }


    if(value.length >= 5){

        input.value =
            value.substring(0,2)
            + "/"
            + value.substring(2,4)
            + "/"
            + value.substring(4);

    }

    else if(value.length >= 3){

        input.value =
            value.substring(0,2)
            + "/"
            + value.substring(2);

    }

    else{

        input.value = value;

    }

}


function thaiToISO(value){

    const match =
        value.match(
            /^(\d{2})\/(\d{2})\/(\d{4})$/
        );


    if(!match){

        return null;

    }


    const day =
        parseInt(match[1]);

    const month =
        parseInt(match[2]);

    const year =
        parseInt(match[3]) - 543;


    const date =
        new Date(
            year,
            month - 1,
            day
        );


    if(
        date.getFullYear() !== year ||
        date.getMonth() !== month - 1 ||
        date.getDate() !== day
    ){

        return null;

    }


    return (

        year.toString().padStart(4,"0")
        + "-"
        + month.toString().padStart(2,"0")
        + "-"
        + day.toString().padStart(2,"0")

    );

}


function isoToThai(value){

    if(!value){

        return "-";

    }


    const parts =
        value.split("-");


    return (

        parts[2]
        + "/"
        + parts[1]
        + "/"
        + (parseInt(parts[0]) + 543)

    );

}


/* =====================================================
   เรียงเอกสารสำหรับเลขทะเบียน
===================================================== */

function numberedDocuments(){

    return [...documents].sort(
        (a,b)=>{

            const dateCompare =
                a.isoDate.localeCompare(
                    b.isoDate
                );


            if(dateCompare !== 0){

                return dateCompare;

            }


            return a.sequence - b.sequence;

        }
    );

}


/* =====================================================
   คำนวณเลข
===================================================== */

function getNumber(doc){

    const list =
        numberedDocuments();


    const index =
        list.findIndex(
            item =>
                item.id === doc.id
        );


    return START_NUMBER + index;

}


function documentNumber(doc){

    return `อวท.${getNumber(doc)}/2569`;

}


/* =====================================================
   เตรียม Dropdown
===================================================== */

function setup(){

    const typeSelect =
        document.getElementById(
            "docType"
        );


    documentTypes.forEach(
        type => {

            const option =
                document.createElement(
                    "option"
                );


            option.value = type;

            option.textContent = type;


            typeSelect.appendChild(
                option
            );

        }
    );


    const orgSelect =
        document.getElementById(
            "docOrg"
        );


    organizations.forEach(
        org => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                org.id;


            option.textContent =
                org.name;


            orgSelect.appendChild(
                option
            );

        }
    );


    const sidebar =
        document.getElementById(
            "sidebarOrganizations"
        );


    organizations.forEach(
        org => {

            sidebar.innerHTML += `

                <div
                    class="menu"
                    onclick="openOrganization('${org.id}')"
                >

                    ▣
                    ${escapeHTML(org.name)}

                </div>

            `;

        }
    );

}


/* =====================================================
   หน้าแรก
===================================================== */

    document.getElementById(

    ).value = "";

        : "-";


    document.getElementById(
        "content"
    ).innerHTML = `

            · วิทยาลัยเทคนิคจะนะ
        </div>

            และชมรมวิชาชีพ

            <br>

            เลขทะเบียนเอกสารเริ่มต้นที่
            <strong>
                อวท.215/2569
            </strong>

        </div>


        <div class="stats">

                <div class="stat-label">
                    จำนวนเอกสารทั้งหมด
                </div>

                <div class="stat-number">

                </div>

            </div>

                <div class="stat-label">
                    เลขทะเบียนล่าสุด
                </div>

                <div class="stat-number">
                    ${latest}
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    เลขทะเบียนเริ่มต้น
                </div>

                <div class="stat-number">
                    อวท.${START_NUMBER}/2569
                </div>

            </div>

                        ${escapeHTML(org.name)}

}


/* =====================================================
   เปิดหน่วยงาน
===================================================== */

function openOrganization(id){

    const org =
        organizations.find(
            item =>
                item.id === id
        );


    if(!org){

        return;

    }


    const projectNames = [
        ...new Set(
            documents
                .filter(
                    doc =>
                        doc.org === id
                )
                .map(
                    doc =>
                        doc.project
                )
        )
    ];


    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="breadcrumb">

            <span onclick="showHome()">
                หน้าแรก
            </span>

            /

            ${escapeHTML(org.name)}

        </div>


        <div class="section-head">

            <div>

                <h1 class="page-title">
                    ${escapeHTML(org.name)}
                </h1>

                <div class="page-subtitle">
                    โครงการและเอกสารของหน่วยงาน
                </div>

            </div>


            <button
                class="btn btn-primary"
                onclick="openAddDocument('${id}')"
            >

                + ลงทะเบียนเอกสาร

            </button>

        </div>


        <div
            id="projectList"
        ></div>

    `;


    const box =
        document.getElementById(
            "projectList"
        );


    if(!projectNames.length){

        box.innerHTML = `

            <div class="empty">

                <h3>
                    ยังไม่มีโครงการ
                </h3>

                <p>
                    เมื่อลงทะเบียนเอกสาร
                    ระบบจะจัดกลุ่มตามโครงการให้อัตโนมัติ
                </p>

            </div>

        `;

        return;

    }


    projectNames.forEach(
        projectName => {

            const docs =
                numberedDocuments()
                    .filter(
                        doc =>
                            doc.org === id &&
                            doc.project === projectName
                    );


            box.innerHTML += `

                <div class="project">

                    <div class="project-header">

                        <div>

                            <div class="project-name">

                                ▣
                                ${escapeHTML(projectName)}

                            </div>


                            <div class="project-date">

                                ${docs.length}
                                รายการเอกสาร

                            </div>

                        </div>

                    </div>


                    <div class="project-body">

                        ${docs
                            .map(
                                documentHTML
                            )
                            .join("")}

                    </div>

                </div>

            `;

        }
    );

}


/* =====================================================
   แสดงเอกสาร
===================================================== */

function documentHTML(doc){

    const files =
        (doc.files || [])
            .map(
                file => `

                    <div class="file">

                        <span>
                            ▣
                        </span>

                        <span>
                            ${escapeHTML(
                                file.name
                            )}
                        </span>

                    </div>

                `
            )
            .join("");


    return `

        <div class="document">


            <div class="document-number">

                ${documentNumber(doc)}

            </div>


            <div class="document-type">

                ${escapeHTML(doc.type)}

            </div>


            <div class="document-subject">

                ${escapeHTML(doc.subject)}

            </div>


            <div class="document-meta">

                วันที่เอกสาร:
                ${isoToThai(doc.isoDate)}

            </div>


            ${
                doc.person
                ?
                `

                    <div class="document-meta">

                        ผู้ลงทะเบียน:
                        ${escapeHTML(
                            doc.person
                        )}

                    </div>

                `
                :
                ""
            }


            ${
                files
                ?
                `

                    <div class="file-list">

                        ${files}

                    </div>

                `
                :
                ""
            }


            <div class="document-actions">


                <button
                    class="btn btn-secondary"
                    onclick="editDocument('${doc.id}')"
                >

                    แก้ไข

                </button>


                <button
                    class="btn btn-danger"
                    onclick="deleteDocument('${doc.id}')"
                >

                    ลบ

                </button>


            </div>


        </div>

    `;

}


/* =====================================================
   ทะเบียนเอกสารทั้งหมด
===================================================== */

function showAllDocuments(){

    document.getElementById(
        "search"
    ).value = "";


    const list =
        numberedDocuments();


    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="breadcrumb">

            <span onclick="showHome()">
                หน้าแรก
            </span>

            /
            ทะเบียนเอกสาร

        </div>


        <div class="section-head">

            <div>

                <h1 class="page-title">
                    ทะเบียนเอกสาร
                </h1>


                <div class="page-subtitle">

                    เรียงตามวันที่เอกสาร
                    จากเก่าไปใหม่

                    ·

                    วันที่เดียวกัน
                    เรียงตามลำดับการลงทะเบียน

                </div>

            </div>


            <button
                class="btn btn-primary"
                onclick="openAddDocument()"
            >

                + ลงทะเบียนเอกสาร

            </button>

        </div>


        <div id="allDocumentList"></div>

    `;


    const box =
        document.getElementById(
            "allDocumentList"
        );


    if(!list.length){

        box.innerHTML = `

            <div class="empty">

                <h3>
                    ยังไม่มีเอกสาร

/* =====================================================
   เปิดเพิ่มเอกสาร
===================================================== */

function openAddDocument(
    orgId = ""
){

    editingId = null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "ลงทะเบียนเอกสาร";


    document.getElementById(
        "docDate"
    ).value = "";


    document.getElementById(
        "docType"
    ).value = "";


    document.getElementById(
        "docOrg"
    ).value = orgId;


    document.getElementById(
        "docProject"
    ).value = "";


    document.getElementById(
        "docSubject"
    ).value = "";


    document.getElementById(
        "docPerson"
    ).value = "";


    document.getElementById(
        "docNote"
    ).value = "";


    document.getElementById(
        "docFiles"
    ).value = "";


    document.getElementById(
        "saveButton"
    ).textContent =
        "บันทึกข้อมูล";


    document.getElementById(
        "modal"
    ).style.display =
        "flex";

}


function closeModal(){

    document.getElementById(
        "modal"
    ).style.display =
        "none";

}


/* =====================================================
   บันทึกเอกสาร
===================================================== */

function saveDocument(){

    const thaiDate =
        document.getElementById(
            "docDate"
        ).value.trim();


    const isoDate =
        thaiToISO(thaiDate);


    const type =
        document.getElementById(
            "docType"
        ).value;


    const org =
        document.getElementById(
            "docOrg"
        ).value;


    const project =
        document.getElementById(
            "docProject"
        ).value.trim();


    const subject =
        document.getElementById(
            "docSubject"
        ).value.trim();


    const person =
        document.getElementById(
            "docPerson"
        ).value.trim();


    const note =
        document.getElementById(
            "docNote"
        ).value.trim();


    if(!isoDate){

        alert(
            "กรุณากรอกวันที่ เช่น 29/09/2569"
        );

        return;

    }


    if(!type){

        alert(
            "กรุณาเลือกประเภทบันทึกข้อความ"
        );

        return;

    }


    if(!org){

        alert(
            "กรุณาเลือกหน่วยงาน"
        );

        return;

    }


    if(!project){

        alert(
            "กรุณากรอกชื่อโครงการ"
        );

        return;

    }


    if(!subject){

        alert(
            "กรุณากรอกชื่อเรื่อง"
        );

        return;

    }


    const files =
        [
            ...document.getElementById(
                "docFiles"
            ).files
        ]
        .map(
            file => ({

                name:file.name,

                size:file.size,

                type:file.type

            })
        );


    if(editingId){

        const doc =
            documents.find(
                item =>
                    item.id === editingId
            );


        if(doc){

            doc.isoDate = isoDate;

            doc.type = type;

            doc.org = org;

            doc.project = project;

            doc.subject = subject;

            doc.person = person;

            doc.note = note;


            if(files.length){

                doc.files = [

                    ...(doc.files || []),

                    ...files

                ];

            }

        }

    }

    else{

        documents.push({

            id:
                Date.now().toString(),

            sequence:
                Date.now(),

            isoDate:
                isoDate,

            type:
                type,

            org:
                org,

            project:
                project,

            subject:
                subject,

            person:
                person,

            note:
                note,

            files:
                files

        });

    }


    saveData();

    closeModal();

    showAllDocuments();

}


/* =====================================================
   แก้ไข
===================================================== */

function editDocument(id){

    const doc =
        documents.find(
            item =>
                item.id === id
        );


    if(!doc){

        return;

    }


    editingId = id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "แก้ไขข้อมูลเอกสาร";


    document.getElementById(
        "docDate"
    ).value =
        isoToThai(
            doc.isoDate
        );


    document.getElementById(
        "docType"
    ).value =
        doc.type;


    document.getElementById(
        "docOrg"
    ).value =
        doc.org;


    document.getElementById(
        "docProject"
    ).value =
        doc.project;


    document.getElementById(
        "docSubject"
    ).value =
        doc.subject;


    document.getElementById(
        "docPerson"
    ).value =
        doc.person || "";


    document.getElementById(
        "docNote"
    ).value =
        doc.note || "";


    document.getElementById(
        "docFiles"
    ).value = "";


    document.getElementById(
        "saveButton"
    ).textContent =
        "บันทึกการแก้ไข";


    document.getElementById(
        "modal"
    ).style.display =
        "flex";

}


/* =====================================================
   ลบ
===================================================== */

function deleteDocument(id){

    const doc =
        documents.find(
            item =>
                item.id === id
        );


    if(!doc){

        return;

    }


    const confirmDelete =
        confirm(

            "ต้องการลบ "
            + documentNumber(doc)
            + "\n"
            + doc.subject
            + "\n\nใช่หรือไม่?"

        );


    if(!confirmDelete){

        return;

    }


    documents =
        documents.filter(
            item =>
                item.id !== id
        );


    saveData();

    showAllDocuments();

}


/* =====================================================
   ค้นหา
===================================================== */

function searchDocuments(){

    const query =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    if(!query){

        showHome();

        return;

    }


    const result =
        numberedDocuments()
            .filter(
                doc => {

                    const org =
                        organizations.find(
                            item =>
                                item.id === doc.org
                        );


                    const searchableText = [

                        documentNumber(doc),

                        doc.type,

                        doc.subject,

                        doc.project,

                        doc.person,

                        org
                            ? org.name
                            : "",

                        isoToThai(
                            doc.isoDate
                        ),

                        ...(doc.files || [])
                            .map(
                                file =>
                                    file.name
                            )

                    ]
                    .join(" ")
                    .toLowerCase();


                    return searchableText
                        .includes(query);

                }
            );


    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="breadcrumb">

            <span onclick="showHome()">
                หน้าแรก
            </span>

            /
            ผลการค้นหา

        </div>


        <h1 class="page-title">
            ผลการค้นหา
        </h1>


        <div class="page-subtitle">

            พบ ${result.length} รายการ

        </div>


        <div
            style="margin-top:20px"
        >

            ${
                result.length
                ?
                result
                    .map(
                        documentHTML
                    )
                    .join("")
                :
                `

                    <div class="empty">

                        <h3>
                            ไม่พบข้อมูล
                        </h3>

                        <p>
                            ลองค้นหาด้วยเลขเอกสาร
                            ชื่อโครงการ
                            หรือชื่อเรื่อง
                        </p>

                    </div>

                `
            }

        </div>

    `;

}

   เริ่มระบบ

loadData();

setup();

showHome();

</script>
