<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบบริหารจัดการเอกสาร อวท. | วิทยาลัยเทคนิคจะนะ</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Noto Sans Thai","Segoe UI",Tahoma,sans-serif;
    background:#f4f6f9;
    color:#202633;
}

/* ================= HEADER ================= */

.header{
    height:82px;
    background:#ffffff;
    border-bottom:4px solid #c69a32;
    display:flex;
    align-items:center;
    padding:0 35px;
    gap:18px;
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    width:58px;
    height:58px;
    object-fit:contain;
}

.header-title{
    line-height:1.3;
}

.header-title-main{
    font-size:20px;
    font-weight:700;
    color:#17365d;
}

.header-title-sub{
    font-size:13px;
    color:#666;
    margin-top:3px;
}

.search{
    margin-left:auto;
    width:330px;
    padding:11px 16px;
    border:1px solid #d8dde5;
    border-radius:7px;
    outline:none;
    font-size:14px;
}

.search:focus{
    border-color:#17365d;
}

/* ================= LAYOUT ================= */

.layout{
    display:flex;
    min-height:calc(100vh - 82px);
}

.sidebar{
    width:255px;
    background:#17365d;
    color:white;
    padding:22px 14px;
}

.sidebar-title{
    font-size:12px;
    color:#cbd5e1;
    padding:12px 12px 8px;
}

.menu{
    padding:12px 14px;
    border-radius:6px;
    margin-bottom:4px;
    cursor:pointer;
    font-size:14px;
}

.menu:hover,
.menu.active{
    background:#244d7c;
}

.main{
    flex:1;
    padding:32px;
    max-width:1500px;
    margin:auto;
}

/* ================= TITLE ================= */

.page-title{
    margin:0;
    color:#17365d;
    font-size:27px;
    font-weight:700;
}

.page-subtitle{
    margin-top:6px;
    color:#6b7280;
    font-size:14px;
}

.breadcrumb{
    font-size:13px;
    color:#777;
    margin-bottom:20px;
}

.breadcrumb span{
    color:#17365d;
    cursor:pointer;
}

/* ================= DASHBOARD ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin:25px 0;
}

.stat{
    background:white;
    border:1px solid #e0e4ea;
    border-radius:8px;
    padding:20px;
}

.stat-label{
    font-size:13px;
    color:#6b7280;
}

.stat-number{
    margin-top:7px;
    font-size:26px;
    font-weight:700;
    color:#17365d;
}

/* ================= SECTION ================= */

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:25px 0 15px;
    gap:15px;
}

.section-title{
    font-size:18px;
    font-weight:700;
    color:#17365d;
}

/* ================= ORGANIZATION ================= */

.org-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
    gap:16px;
}

.org-card{
    background:white;
    border:1px solid #e0e4ea;
    border-radius:8px;
    padding:22px;
    cursor:pointer;
    transition:.15s;
}

.org-card:hover{
    border-color:#b38b32;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.org-icon{
    width:45px;
    height:45px;
    border-radius:7px;
    background:#eef3f8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    margin-bottom:14px;
}

.org-name{
    font-weight:700;
    color:#243b5a;
    line-height:1.5;
}

.org-count{
    color:#777;
    font-size:13px;
    margin-top:7px;
}

/* ================= BUTTON ================= */

.btn{
    padding:10px 17px;
    border-radius:6px;
    border:0;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
}

.btn-primary{
    background:#17365d;
    color:white;
}

.btn-primary:hover{
    background:#102b4b;
}

.btn-secondary{
    background:white;
    color:#17365d;
    border:1px solid #cfd5dd;
}

.btn-danger{
    background:#fff1f1;
    color:#b42318;
    border:1px solid #f2c4c4;
}

/* ================= PROJECT ================= */

.project{
    background:white;
    border:1px solid #e0e4ea;
    border-radius:8px;
    margin-bottom:15px;
}

.project-header{
    padding:18px 20px;
    border-bottom:1px solid #e9edf2;
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.project-name{
    font-weight:700;
    color:#17365d;
    font-size:16px;
}

.project-date{
    color:#777;
    font-size:12px;
    margin-top:5px;
}

.project-body{
    padding:12px 20px 18px;
}

/* ================= DOCUMENT ================= */

.document{
    border:1px solid #e1e5eb;
    border-radius:7px;
    padding:16px;
    margin-top:10px;
    background:#fafbfc;
}

.document-number{
    color:#17365d;
    font-size:17px;
    font-weight:800;
}

.document-type{
    font-size:12px;
    color:#6b7280;
    margin-top:4px;
}

.document-subject{

    margin-top:8px;
}

.document-meta{

}

.file-list{
    margin-top:12px;
    padding-top:10px;

}

.file{

    align-items:center;
    gap:9px;
    padding:7px;
    font-size:13px;
}

.file:hover{
    background:#eef3f8;
}

.file-name{
    flex:1;
}

.document-actions{
    display:flex;
    gap:7px;
    margin-top:12px;
}

/* ================= MODAL ================= */

.modal-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.48);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal{
    width:min(720px,100%);
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:10px;
    padding:25px;
}

.modal-title{
    color:#17365d;
    margin:0 0 20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    border:1px solid #d5dae2;
    border-radius:6px;
    padding:10px;
    font:inherit;

}

.field textarea{
    min-height:80px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;

}

    color:#777;
    font-size:11px;

/* ================= EMPTY ================= */

.empty{

    border:1px dashed #ccd2da;

@media(max-width:800px){

        grid-template-columns:1fr;

    }

        grid-column:auto;
    }

}

</style>
</head>


<body>

<script>


/* =====================================================
   ประเภทบันทึกข้อความ
===================================================== */

const documentTypes = [

"บันทึกข้อความขออนุมัติโครงการ",

"บันทึกข้อความขออนุญาตดำเนินโครงการ",

"บันทึกข้อความขอเชิญประชุม",

"บันทึกข้อความรายงานผลการประชุม",

"บันทึกขออนุญาตลงนามในคำสั่งวิทยาลัยฯ โครงการ",

"บันทึกขออนุญาตลงนามในประกาศ อวท. โครงการ",

"บันทึกข้อความขออนุญาตประชาสัมพันธ์",

"บันทึกข้อความขออนุญาตใช้สถานที่",

"บันทึกข้อความเชิญวิทยากร",

"บันทึกข้อความขอเวลาเรียน",

"บันทึกข้อความสรุปงบประมาณการดำเนินโครงการ",

"บันทึกข้อความรายงานสรุปจำนวนผู้เข้าร่วมโครงการ",

"บันทึกข้อความรายงานผลการดำเนินโครงการ",

"บันทึกข้อความรายงานสรุปผลการดำเนินงานตามโครงการ",

"บันทึกข้อความขออนุญาตเปลี่ยนสถานที่จัดโครงการ",

"บันทึกข้อความขออนุญาตลงนามในเกียรติบัตร",

"บันทึกข้อความขอเชิญเป็นประธานเปิดโครงการ",

"บันทึกข้อความขออนุญาตผู้บังคับบัญชาพานักเรียนออกนอกสถานที่"

];


/* =====================================================
   หน่วยงาน
===================================================== */

const organizations = [

{
    id:"aft",
    name:"องค์การนักวิชาชีพในอนาคตแห่งประเทศไทย",
    icon:"อวท."
},

{
    id:"electric",
    name:"ชมรมวิชาชีพช่างไฟฟ้ากำลัง",
    icon:"ฟฟ."
},

{
    id:"auto",
    name:"ชมรมวิชาชีพช่างยนต์",
    icon:"ยน."
},

{
    id:"electronic",
    name:"ชมรมวิชาชีพช่างอิเล็กทรอนิกส์",
    icon:"อท."
},

{
    id:"construction",
    name:"ชมรมวิชาชีพก่อสร้าง",
    icon:"กส."
},

{
    id:"welding",
    name:"ชมรมวิชาชีพช่างเชื่อมโลหะ",
    icon:"ชม."
},

{
    id:"accounting",
    name:"ชมรมวิชาชีพการบัญชี",
    icon:"บช."
},

{
    id:"digital",
    name:"ชมรมวิชาชีพเทคโนโลยีธุรกิจดิจิทัล",
    icon:"ดท."
},

{
    id:"sadao",
    name:"ชมรมวิชาชีพศูนย์ฝึกอบรมวิชาชีพอำเภอสะเดา",
    icon:"ศฝ."
}

];


/* =====================================================
   เริ่มเลขทะเบียน
===================================================== */

const START_NUMBER = 215;


/* =====================================================
   ข้อมูล
===================================================== */

let documents = [];

let editingId = null;

const STORAGE_KEY =
    "aft_chana_document_system_v2";


/* =====================================================
   โหลดข้อมูล
===================================================== */

function loadData(){

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if(saved){

        try{

            documents =
                JSON.parse(saved);

        }catch(e){

            documents = [];

        }

    }

}


function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(documents)
    );

}


/* =====================================================
   วันที่ไทย
===================================================== */

function formatThaiDate(input){

    let value =
        input.value.replace(/\D/g,"");

    if(value.length > 8)
        value = value.substring(0,8);

    if(value.length >= 5){

        input.value =
            value.substring(0,2)+"/"+
            value.substring(2,4)+"/"+
            value.substring(4);

    }else if(value.length >= 3){

        input.value =
            value.substring(0,2)+"/"+
            value.substring(2);

    }else{

        input.value=value;

    }

}


function thaiToISO(value){

    const match =
        value.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);

    if(!match)
        return null;

    const day =
        parseInt(match[1]);

    const month =
        parseInt(match[2]);

    const year =
        parseInt(match[3])-543;

    const date =
        new Date(year,month-1,day);

    if(
        date.getFullYear()!==year ||
        date.getMonth()!==month-1 ||
        date.getDate()!==day
    ){

        return null;

    }

    return (
        year.toString().padStart(4,"0")+
        "-"+
        month.toString().padStart(2,"0")+
        "-"+
        day.toString().padStart(2,"0")
    );

}


function isoToThai(value){

    if(!value)
        return "-";

    const p =
        value.split("-");

    return (
        p[2]+"/"+
        p[1]+"/"+
        (parseInt(p[0])+543)
    );

}


/* =====================================================
   เรียงเลขเอกสาร
===================================================== */

function numberedDocuments(){

    return [...documents].sort((a,b)=>{

        const date =
            a.isoDate.localeCompare(b.isoDate);

        if(date!==0)
            return date;

        return a.sequence-b.sequence;

    });

}


function getNumber(doc){

    const list =
        numberedDocuments();

    const index =
        list.findIndex(
            x=>x.id===doc.id
        );

    return START_NUMBER + index;

}


function documentNumber(doc){

    return `อวท.${getNumber(doc)}/2569`;

}


/* =====================================================
   HTML Escape
===================================================== */

function escapeHTML(value){

    return String(value||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   เตรียมระบบ
===================================================== */

function setup(){

    const type =
        document.getElementById("docType");

    documentTypes.forEach(item=>{

        const option =
            document.createElement("option");

        option.value=item;
        option.textContent=item;

        type.appendChild(option);

    });


    const org =
        document.getElementById("docOrg");

    organizations.forEach(item=>{

        const option =
            document.createElement("option");

        option.value=item.id;
        option.textContent=item.name;

        org.appendChild(option);

    });


    const sidebar =
        document.getElementById(
            "sidebarOrganizations"
        );

    organizations.forEach(item=>{

        sidebar.innerHTML += `

            <div
                class="menu"
                onclick="openOrganization('${item.id}')"
            >

                ${item.icon}
                ${escapeHTML(item.name)}

            </div>

        `;

    });

}


/* =====================================================
   หน้าแรก
===================================================== */

        ? documentNumber(last[last.length-1])
        : "-";

            </div>

                </div>

            </div>


            <div class="stat">

                    เลขทะเบียนเริ่มต้น
                </div>

                <div class="stat-number">
                    อวท.${START_NUMBER}/2569
                </div>

            </div>

        </div>


        <div class="section-head">

            <div class="section-title">
                หน่วยงาน
            </div>

            <button
                class="btn btn-primary"
                onclick="openAddDocument()"
            >
                + ลงทะเบียนเอกสาร
            </button>

        </div>


        <div
            class="org-grid"
            id="organizationGrid"
        ></div>

    `;


    const grid =
        document.getElementById(
            "organizationGrid"
        );


    organizations.forEach(org=>{

        const count =
            documents.filter(
                d=>d.org===org.id
            ).length;


        grid.innerHTML += `

            <div
                class="org-card"
                onclick="openOrganization('${org.id}')"
            >

                <div class="org-icon">
                    ${org.icon}
                </div>

                <div class="org-name">
                    ${escapeHTML(org.name)}
                </div>

                <div class="org-count">
                    ${count} เอกสาร
                </div>

            </div>

        `;

    });

}


/* =====================================================
   เปิดหน่วยงาน
===================================================== */

function openOrganization(id){

    const org =
        organizations.find(
            x=>x.id===id
        );

    if(!org)
        return;


    const projects =
        [...new Set(
            documents
                .filter(d=>d.org===id)
                .map(d=>d.project)
        )];


    document.getElementById("content").innerHTML=`

        <div class="breadcrumb">

            <span onclick="showHome()">
                หน้าแรก
            </span>

            /
            ${escapeHTML(org.name)}

        </div>


        <div class="section-head">

            <div>

                <h1 class="page-title">
                    ${escapeHTML(org.name)}
                </h1>

                <div class="page-subtitle">
                    รายการโครงการและเอกสาร
                </div>

            </div>


            <button
                class="btn btn-primary"
                onclick="openAddDocument('${id}')"
            >
                + ลงทะเบียนเอกสาร
            </button>

        </div>


        <div id="projectList"></div>

    `;


    renderProjects(id,projects);

}


/* =====================================================
   แสดงโครงการ
===================================================== */

function renderProjects(orgId,projectNames){

    const box =
        document.getElementById(
            "projectList"
        );


    if(projectNames.length===0){

        box.innerHTML=`

            <div class="empty">

                <h3>
                    ยังไม่มีโครงการ
                </h3>

                <p>
                    เมื่อลงทะเบียนเอกสาร
                    ระบบจะจัดกลุ่มตามโครงการให้อัตโนมัติ
                </p>

            </div>

        `;

        return;

    }


    projectNames.forEach(projectName=>{

        const docs =
            numberedDocuments()
                .filter(
                    d=>
                    d.org===orgId &&
                    d.project===projectName
                );


        box.innerHTML += `

            <div class="project">

                <div class="project-header">

                    <div>

                        <div class="project-name">
                            📁 ${escapeHTML(projectName)}
                        </div>

                        <div class="project-date">
                            ${docs.length}
                            รายการเอกสาร
                        </div>

                    </div>

                </div>


                <div class="project-body">

                    ${docs.map(
                        d=>documentHTML(d)
                    ).join("")}

                </div>

            </div>

        `;

    });

}


/* =====================================================
   เอกสาร
===================================================== */

function documentHTML(doc){

    const files =
        (doc.files||[]).map(
            file=>`

                <div class="file">

                    <span>📎</span>

                    <span class="file-name">
                        ${escapeHTML(file.name)}
                    </span>

                </div>

            `
        ).join("");


    return `

        <div class="document">

            <div class="document-number">
                ${documentNumber(doc)}
            </div>

            <div class="document-type">
                ${escapeHTML(doc.type)}
            </div>

            <div class="document-subject">
                ${escapeHTML(doc.subject)}
            </div>

            <div class="document-meta">
                วันที่เอกสาร:
                ${isoToThai(doc.isoDate)}
            </div>

            ${
                doc.person
                ?
                `
                <div class="document-meta">
                    ผู้ลงทะเบียน:
                    ${escapeHTML(doc.person)}
                </div>
                `
                :
                ""
            }


            ${
                files
                ?
                `
                <div class="file-list">
                    ${files}
                </div>
                `
                :
                ""
            }


            <div class="document-actions">

                <button
                    class="btn btn-secondary"
                    onclick="editDocument('${doc.id}')"
                >
                    แก้ไข
                </button>

                <button
                    class="btn btn-danger"
                    onclick="deleteDocument('${doc.id}')"
                >
                    ลบ
                </button>

            </div>

        </div>

    `;

}


/* =====================================================
   เอกสารทั้งหมด
===================================================== */

function showAllDocuments(){

    document.getElementById("search").value="";

    const list =
        numberedDocuments();


    document.getElementById("content").innerHTML=`

        <div class="breadcrumb">

            <span onclick="showHome()">
                หน้าแรก
            </span>

            /
            ทะเบียนเอกสาร

        </div>


        <div class="section-head">

            <div>

                <h1 class="page-title">
                    ทะเบียนเอกสาร
                </h1>

                <div class="page-subtitle">
                    เรียงตามวันที่เอกสาร
                    จากเก่าไปใหม่
                </div>

            </div>


            <button
                class="btn btn-primary"
                onclick="openAddDocument()"
            >
                + ลงทะเบียนเอกสาร
            </button>

        </div>


        <div id="allDocumentList"></div>

    `;


    const box =
        document.getElementById(
            "allDocumentList"
        );


    if(!list.length){

        box.innerHTML=`

            <div class="empty">

                <h3>
                    ยังไม่มีเอกสาร
                </h3>

            </div>

        `;

        return;

    }


    list.forEach(doc=>{

        box.innerHTML +=
            documentHTML(doc);

    });

}


/* =====================================================
   เปิดเพิ่มเอกสาร
===================================================== */

function openAddDocument(orgId=""){

    editingId=null;

    document.getElementById(
        "modalTitle"
    ).textContent=
        "ลงทะเบียนเอกสาร";


    document.getElementById(
        "docDate"
    ).value="";


    document.getElementById(
        "docType"
    ).value="";


    document.getElementById(
        "docOrg"
    ).value=orgId;


    document.getElementById(
        "docProject"
    ).value="";


    document.getElementById(
        "docSubject"
    ).value="";


    document.getElementById(
        "docPerson"
    ).value="";


    document.getElementById(
        "docNote"
    ).value="";


    document.getElementById(
        "docFiles"
    ).value="";


    document.getElementById(
        "saveButton"
    ).textContent=
        "บันทึกข้อมูล";


    document.getElementById(
        "modal"
    ).style.display="flex";

}


function closeModal(){

    document.getElementById(
        "modal"
    ).style.display="none";

}


/* =====================================================
   บันทึก
===================================================== */

function saveDocument(){

    const thaiDate =
        document.getElementById(
            "docDate"
        ).value.trim();


    const isoDate =
        thaiToISO(thaiDate);


    if(!isoDate){

        alert(
            "กรุณากรอกวันที่ เช่น 29/09/2569"
        );

        return;

    }


    const type =
        document.getElementById(
            "docType"
        ).value;


    const org =
        document.getElementById(
            "docOrg"
        ).value;


    const project =
        document.getElementById(
            "docProject"
        ).value.trim();


    const subject =
        document.getElementById(
            "docSubject"
        ).value.trim();


    const person =
        document.getElementById(
            "docPerson"
        ).value.trim();


    const note =
        document.getElementById(
            "docNote"
        ).value.trim();


    if(!type){

        alert("กรุณาเลือกประเภทบันทึกข้อความ");

        return;

    }


    if(!org){

        alert("กรุณาเลือกหน่วยงาน");

        return;

    }


    if(!project){

        alert("กรุณากรอกชื่อโครงการ");

        return;

    }


    if(!subject){

        alert("กรุณากรอกชื่อเรื่อง");

        return;

    }


    const files =
        [...document.getElementById(
            "docFiles"
        ).files].map(
            file=>({
                name:file.name,
                size:file.size,
                type:file.type
            })
        );


    if(editingId){

        const doc =
            documents.find(
                x=>x.id===editingId
            );


        if(doc){

            doc.isoDate=isoDate;
            doc.type=type;
            doc.org=org;
            doc.project=project;
            doc.subject=subject;
            doc.person=person;
            doc.note=note;

            if(files.length){

                doc.files =
                    [
                        ...(doc.files||[]),
                        ...files
                    ];

            }

        }

    }else{

        documents.push({

            id:
                Date.now().toString(),

            sequence:
                Date.now(),

            isoDate:isoDate,

            type:type,

            org:org,

            project:project,

            subject:subject,

            person:person,

            note:note,

            files:files

        });

    }


    saveData();

    closeModal();

    showAllDocuments();

}


/* =====================================================
   แก้ไข
===================================================== */

function editDocument(id){

    const doc =
        documents.find(
            x=>x.id===id
        );


    if(!doc)
        return;


    editingId=id;


    document.getElementById(
        "modalTitle"
    ).textContent=
        "แก้ไขข้อมูลเอกสาร";


    document.getElementById(
        "docDate"
    ).value=
        isoToThai(doc.isoDate);


    document.getElementById(
        "docType"
    ).value=
        doc.type;


    document.getElementById(
        "docOrg"
    ).value=
        doc.org;


    document.getElementById(
        "docProject"
    ).value=
        doc.project;


    document.getElementById(
        "docSubject"
    ).value=
        doc.subject;


    document.getElementById(
        "docPerson"
    ).value=
        doc.person||"";


    document.getElementById(
        "docNote"
    ).value=
        doc.note||"";


    document.getElementById(
        "docFiles"
    ).value="";


    document.getElementById(
        "saveButton"
    ).textContent=
        "บันทึกการแก้ไข";


    document.getElementById(
        "modal"
    ).style.display="flex";

}


/* =====================================================
   ลบ
===================================================== */

function deleteDocument(id){

    const doc =
        documents.find(
            x=>x.id===id
        );


    if(!doc)
        return;


    const confirmDelete =
        confirm(
            "ต้องการลบ "+documentNumber(doc)+
            "\n"+doc.subject+
            "\n\nใช่หรือไม่?"
        );


    if(!confirmDelete)
        return;


    documents =
        documents.filter(
            x=>x.id!==id
        );


    saveData();

    showAllDocuments();

}


/* =====================================================
   ค้นหา
===================================================== */

function searchDocuments(){

    const query =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();


    if(!query){

        showHome();

        return;

    }


    const result =
        numberedDocuments()
        .filter(doc=>{

            const org =
                organizations.find(
                    x=>x.id===doc.org
                );


            const text = [

                documentNumber(doc),

                doc.type,

                doc.subject,

                doc.project,

                doc.person,

                org ? org.name : "",

                isoToThai(doc.isoDate),

                ...(doc.files||[])
                    .map(f=>f.name)

            ]
            .join(" ")
            .toLowerCase();


            return text.includes(query);

        });


    document.getElementById(
        "content"
    ).innerHTML=`

        <div class="breadcrumb">
            ผลการค้นหา
        </div>

        <h1 class="page-title">
            ผลการค้นหา
        </h1>

        <div class="page-subtitle">
            พบ ${result.length} รายการ
        </div>

        <div
            style="margin-top:20px"
            id="searchResult"
        ></div>

    `;


    const box =
        document.getElementById(
            "searchResult"
        );


    result.forEach(doc=>{

        box.innerHTML +=
            documentHTML(doc);

    });

}

   เริ่มระบบ
===================================================== */

loadData();

setup();

showHome();

</script>
