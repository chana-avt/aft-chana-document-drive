<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบเอกสาร อวท. วิทยาลัยเทคนิคจะนะ</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI","Tahoma",sans-serif;
  background:#f5f7fb;
  color:#202124;
}
.header{
  height:70px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;

  padding:0 28px;
  position:sticky;
  top:0;
  z-index:10;
}
.logo{
  display:flex;

  gap:10px;

  font-weight:700;

  white-space:nowrap;
}
.logo-icon{

  height:42px;
  background:#e9f2ff;
  border-radius:12px;

}
.search{

  max-width:650px;
  border:0;

}
.layout{display:flex;min-height:calc(100vh - 70px)}
.sidebar{

  border-right:1px solid #e5e7eb;

}
.menu{

  border-radius:10px;

  font-size:14px;
}
.menu:hover,.menu.active{
  background:#eaf2ff;

  font-weight:600;
}
.menu-title{
  color:#888;
  font-size:12px;

}
.main{
  flex:1;
  padding:30px;
  max-width:1500px;
  margin:auto;
}
.page-title{
  font-size:27px;
  margin:0 0 8px;
}
.description{
  color:#777;
  margin:0 0 25px;
}
.breadcrumb{
  color:#777;
  font-size:14px;
  margin-bottom:20px;
}
.breadcrumb span{

}
.grid{

  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));

}
.card{
  background:#fff;
  border:1px solid #e4e7ec;
  border-radius:16px;
  padding:22px;

}
.card:hover{

}
.folder{

  margin-bottom:12px;
}
.card-title{

  line-height:1.5;
}
.card-info{
  color:#777;
  font-size:13px;
  margin-top:7px;
}
.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;

}
.btn{
  border:0;
  border-radius:10px;
  padding:11px 18px;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
}
.primary{
  background:#1769e0;
  color:#fff;
}
.primary:hover{background:#0e56be}
.secondary{
  background:#fff;
  border:1px solid #ddd;
}
.danger{

  color:#c62828;
  border:1px solid #ffcaca;
}

}
.document-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
}
.doc-number{
  color:#1769e0;
  font-weight:800;
  font-size:18px;
}
.doc-type{
  font-size:13px;
  color:#666;
  margin-top:6px;
}
.doc-title{
  font-size:16px;
  font-weight:700;
  margin-top:10px;
}
.doc-meta{
  color:#777;
  font-size:13px;
  margin-top:7px;
}
.file-list{
  margin-top:15px;
  border-top:1px solid #eee;
  padding-top:12px;
}
.file{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  border-radius:8px;
}
.file:hover{background:#f5f7fa}

  display:flex;
  gap:7px;
  margin-top:15px;

}

}
.empty-icon{font-size:50px;margin-bottom:10px}
.modal-bg{

  inset:0;
  background:rgba(0,0,0,.45);
  z-index:100;
  align-items:center;
  justify-content:center;

}
.modal{
  width:min(720px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.field{margin-bottom:5px}
.field.full{grid-column:1/-1}
.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}
.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #d8dce3;
  border-radius:9px;
  padding:11px;
  font:inherit;
  outline:none;
}
.field textarea{min-height:80px;resize:vertical}
.file-input{
  background:#f7f8fa;
  padding:12px;
  border-radius:9px;
}
.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}
.hint{
  font-size:12px;
  color:#777;
  margin-top:5px;
}
.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:20px;
}
.stat-number{
  font-size:28px;
  font-weight:800;
  color:#1769e0;
}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

  margin-bottom:25px;
}

  .sidebar{display:none}
  .header{padding:0 14px}

  .main{padding:20px 14px}

</head>

<body>

<header class="header">
  <div class="logo">
    <div class="logo-icon">📁</div>
    <div class="logo-text">ระบบเอกสาร อวท.</div>
  </div>

  <input
    id="search"
    class="search"
    placeholder="🔍 ค้นหาเลขเอกสาร โครงการ เรื่อง หรือไฟล์..."
    oninput="searchDocuments()"
  >
</header>

<div class="layout">

<aside class="sidebar">

  <div class="menu active" onclick="home()">🏠 หน้าแรก</div>
  <div class="menu" onclick="showAllDocuments()">📄 เอกสารทั้งหมด</div>

  <div class="menu-title">หน่วยงาน</div>

  <div id="sidebarOrg"></div>

</aside>

<main class="main">
  <div id="content"></div>
</main>

</div>


<!-- MODAL -->
<div class="modal-bg" id="modal">

<div class="modal">

<h2 id="modalTitle">➕ เพิ่มเอกสาร</h2>

<div class="form-grid">

<div class="field">
<label>วันที่เอกสาร *</label>
<input
 id="docDate"
 type="text"
 maxlength="10"
 placeholder="วว/ดด/2569"
 oninput="formatThaiDate(this)"
>
<div class="hint">ตัวอย่าง 29/09/2569</div>
</div>

<div class="field">
<label>ประเภทบันทึกข้อความ *</label>
<select id="docType">
<option value="">-- เลือกประเภท --</option>
</select>
</div>

<div class="field">
<label>หน่วยงาน / ชมรม *</label>
<select id="docOrg">
<option value="">-- เลือกหน่วยงาน --</option>
</select>
</div>

<div class="field">
<label>ชื่อโครงการ *</label>
<input id="docProject" placeholder="ชื่อโครงการ">
</div>

<div class="field full">
<label>ชื่อเรื่อง *</label>
<input id="docSubject" placeholder="ชื่อเรื่องของบันทึกข้อความ">
</div>

<div class="field">
<label>ผู้ลงทะเบียน</label>
<input id="docPerson" placeholder="ชื่อผู้ลงทะเบียน">
</div>

<div class="field">
<label>ไฟล์เอกสาร</label>
<input
 id="docFiles"
 class="file-input"
 type="file"
 multiple
>
</div>

<div class="field full">
<label>หมายเหตุ</label>
<textarea id="docNote" placeholder="หมายเหตุเพิ่มเติม"></textarea>
</div>

</div>

<div class="modal-actions">
<button class="btn secondary" onclick="closeModal()">ยกเลิก</button>
<button class="btn primary" onclick="saveDocument()">บันทึกเอกสาร</button>
</div>

</div>
</div>


<script>

/* =========================
   ประเภทบันทึกข้อความ 19 รายการ
========================= */

const types = [
"บันทึกข้อความขออนุมัติโครงการ",
"บันทึกข้อความขออนุญาตดำเนินโครงการ",
"บันทึกข้อความขออนุญาตประชุม",
"บันทึกข้อความขอเชิญประชุม",
"บันทึกข้อความรายงานผลการประชุม",
"บันทึกขออนุญาตลงนามในคำสั่งวิทยาลัยฯ โครงการ",
"บันทึกขออนุญาตลงนามในประกาศ อวท. โครงการ",
"บันทึกข้อความขออนุญาตประชาสัมพันธ์",
"บันทึกข้อความขออนุญาตใช้สถานที่",
"บันทึกข้อความเชิญวิทยากร",
"บันทึกข้อความขอเวลาเรียน",
"บันทึกข้อความสรุปงบประมาณการดำเนินโครงการ",
"บันทึกข้อความรายงานสรุปจำนวนผู้เข้าร่วมโครงการ",
"บันทึกข้อความรายงานผลการดำเนินโครงการ",
"บันทึกข้อความรายงานสรุปผลการดำเนินงานตามโครงการ",
"บันทึกข้อความขออนุญาตเปลี่ยนสถานที่จัดโครงการ",
"บันทึกข้อความขออนุญาตลงนามในเกียรติบัตร",
"บันทึกข้อความขอเชิญเป็นประธานเปิดโครงการ",
"บันทึกข้อความขออนุญาตผู้บังคับบัญชาพานักเรียนออกนอกสถานที่"
];


/* =========================
   หน่วยงาน
========================= */

const organizations = [

{
 id:"aft",
 name:"องค์การนักวิชาชีพในอนาคตแห่งประเทศไทย",
 icon:"🏛️"
},

{
 id:"electric",
 name:"ชมรมวิชาชีพช่างไฟฟ้ากำลัง",
 icon:"⚡"
},

{
 id:"auto",
 name:"ชมรมวิชาชีพช่างยนต์",
 icon:"🔧"
},

{
 id:"electronic",
 name:"ชมรมวิชาชีพช่างอิเล็กทรอนิกส์",
 icon:"🔌"
},

{
 id:"construction",
 name:"ชมรมวิชาชีพก่อสร้าง",
 icon:"🏗️"
},

{
 id:"welding",
 name:"ชมรมวิชาชีพช่างเชื่อมโลหะ",
 icon:"🔥"
},

{
 id:"accounting",
 name:"ชมรมวิชาชีพการบัญชี",
 icon:"📊"
},

{
 id:"digital",
 name:"ชมรมวิชาชีพเทคโนโลยีธุรกิจดิจิทัล",
 icon:"💻"
},

{
 id:"sadao",
 name:"ชมรมวิชาชีพศูนย์ฝึกอบรมวิชาชีพอำเภอสะเดา",
 icon:"🏫"
}

];


/* =========================
   ข้อมูลเอกสาร
========================= */

let documents = [];


/*
  ลำดับเริ่มต้น
  อวท.215/2569
*/

const START_NUMBER = 215;


/* =========================
   LocalStorage
========================= */

const STORAGE_KEY = "aft_chana_documents_v1";

function loadData(){

  try{
    const saved=localStorage.getItem(STORAGE_KEY);

    if(saved){
      documents=JSON.parse(saved);
    }

  }catch(e){
    documents=[];
  }

}

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(documents)
  );

}


/* =========================
   วันที่ไทย
========================= */

function formatThaiDate(input){

  let v=input.value.replace(/\D/g,"");

  if(v.length>8) v=v.slice(0,8);

  if(v.length>=5){
    input.value=
      v.slice(0,2)+"/"+
      v.slice(2,4)+"/"+
      v.slice(4);
  }
  else if(v.length>=3){
    input.value=
      v.slice(0,2)+"/"+
      v.slice(2);
  }
  else{
    input.value=v;
  }

}


function thaiToISO(date){

  const m=date.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);

  if(!m) return null;

  const d=parseInt(m[1]);
  const month=parseInt(m[2]);
  const year=parseInt(m[3])-543;

  const test=new Date(year,month-1,d);

  if(
    test.getFullYear()!==year ||
    test.getMonth()!==month-1 ||
    test.getDate()!==d
  ){
    return null;
  }

  return (
    year.toString().padStart(4,"0")+
    "-"+
    month.toString().padStart(2,"0")+
    "-"+
    d.toString().padStart(2,"0")
  );

}


function isoToThai(date){

  if(!date)return "-";

  const p=date.split("-");

  return `${p[2]}/${p[1]}/${parseInt(p[0])+543}`;

}


/* =========================
   ลำดับเลขเอกสาร
========================= */

function numberedDocuments(){

  return [...documents].sort((a,b)=>{

    const dateCompare=
      a.isoDate.localeCompare(b.isoDate);

    if(dateCompare!==0){
      return dateCompare;
    }

    return a.seq-b.seq;

  });

}


function getNumber(doc){

  const list=numberedDocuments();

  const index=
    list.findIndex(x=>x.id===doc.id);

  return START_NUMBER+index;

}


function documentNumber(doc){

  return `อวท.${getNumber(doc)}/2569`;

}


/* =========================
   Escape HTML
========================= */

function esc(value){

  return String(value||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   เตรียม Dropdown
========================= */

function setupSelects(){

  const type=
    document.getElementById("docType");

  types.forEach(t=>{

    type.innerHTML+=
      `<option value="${esc(t)}">${esc(t)}</option>`;

  });


  const org=
    document.getElementById("docOrg");

  organizations.forEach(o=>{

    org.innerHTML+=
      `<option value="${o.id}">${esc(o.name)}</option>`;

  });


  const sidebar=
    document.getElementById("sidebarOrg");

  organizations.forEach(o=>{

    sidebar.innerHTML+=`

      <div
        class="menu"
        onclick="openOrganization('${o.id}')">

        ${o.icon} ${esc(o.name)}

      </div>

    `;

  });

}


/* =========================
   หน้าแรก
========================= */

function home(){

  document.getElementById("search").value="";

  const total=documents.length;

  const latest=
    numberedDocuments().length
    ? documentNumber(
        numberedDocuments()[numberedDocuments().length-1]
      )
    : "-";


  document.getElementById("content").innerHTML=`

    <h1 class="page-title">
      📁 ระบบเอกสาร อวท.
    </h1>

    <p class="description">
      ระบบทะเบียนเลขเอกสารและคลังเอกสาร
      องค์การนักวิชาชีพในอนาคตแห่งประเทศไทย
      วิทยาลัยเทคนิคจะนะ
    </p>

    <div class="stats">

      <div class="stat">
        <div>เอกสารทั้งหมด</div>
        <div class="stat-number">${total}</div>
      </div>

      <div class="stat">
        <div>เลขเอกสารล่าสุด</div>
        <div class="stat-number" style="font-size:20px">
          ${latest}
        </div>
      </div>

      <div class="stat">
        <div>เลขเริ่มต้น</div>
        <div class="stat-number">
          ${START_NUMBER}
        </div>
      </div>

    </div>

    <div class="toolbar">

      <div>
        <h2>หน่วยงาน</h2>
      </div>

      <button
        class="btn primary"
        onclick="openAddDocument()">

        ＋ ลงทะเบียนเอกสาร

      </button>

    </div>

    <div class="grid" id="orgGrid"></div>

  `;


  const grid=
    document.getElementById("orgGrid");


  organizations.forEach(org=>{

    const count=
      documents.filter(d=>d.org===org.id).length;


    grid.innerHTML+=`

      <div
        class="card"
        onclick="openOrganization('${org.id}')">

        <div class="folder">
          ${org.icon}
        </div>

        <div class="card-title">
          ${esc(org.name)}
        </div>

        <div class="card-info">
          📄 ${count} เอกสาร
        </div>

      </div>

    `;

  });

}


/* =========================
   เปิดหน่วยงาน
========================= */

function openOrganization(id){

  const org=
    organizations.find(x=>x.id===id);

  if(!org)return;


  const list=
    numberedDocuments()
      .filter(d=>d.org===id);


  document.getElementById("content").innerHTML=`

    <div class="breadcrumb">
      <span onclick="home()">หน้าแรก</span>
      /
      ${esc(org.name)}
    </div>

    <div class="toolbar">

      <div>

        <h1 class="page-title">
          ${org.icon} ${esc(org.name)}
        </h1>

        <p class="description">
          ${list.length} เอกสาร
        </p>

      </div>

      <button
        class="btn primary"
        onclick="openAddDocument('${id}')">

        ＋ ลงทะเบียนเอกสาร

      </button>

    </div>

    <div id="documentList"></div>

  `;


  renderDocumentList(list);

}


/* =========================
   แสดงเอกสาร
========================= */

function renderDocumentList(list){

  const box=
    document.getElementById("documentList");

  if(!list.length){

    box.innerHTML=`

      <div class="empty">

        <div class="empty-icon">📂</div>

        <h3>ยังไม่มีเอกสาร</h3>

        <p>กด “ลงทะเบียนเอกสาร” เพื่อเพิ่มรายการแรก</p>

      </div>

    `;

    return;

  }


  box.innerHTML="";

  list.forEach(doc=>{

    box.innerHTML+=documentHTML(doc);

  });

}


function documentHTML(doc){

  const org=
    organizations.find(o=>o.id===doc.org);


  let filesHTML="";


  if(doc.files && doc.files.length){

    doc.files.forEach(file=>{

      filesHTML+=`

        <div class="file">

          <div>📄</div>

          <div class="file-name">
            ${esc(file.name)}
          </div>

          <div class="badge">
            ไฟล์
          </div>

        </div>

      `;

    });

  }
  else{

    filesHTML=
      `<div class="hint">ยังไม่มีไฟล์แนบ</div>`;

  }


  return `

    <div class="document">

      <div class="document-top">

        <div>

          <div class="doc-number">
            ${documentNumber(doc)}
          </div>

          <div class="doc-type">
            ${esc(doc.type)}
          </div>

          <div class="doc-title">
            ${esc(doc.subject)}
          </div>

          <div class="doc-meta">
            📅 ${isoToThai(doc.isoDate)}
            &nbsp; • &nbsp;
            🏢 ${esc(org ? org.name : "-")}
          </div>

          <div class="doc-meta">
            📁 โครงการ: ${esc(doc.project)}
          </div>

          ${
            doc.person
            ? `<div class="doc-meta">👤 ${esc(doc.person)}</div>`
            : ""
          }

        </div>

        <div class="badge">
          อวท.${getNumber(doc)}/2569
        </div>

      </div>


      <div class="file-list">

        ${filesHTML}

      </div>


      <div class="actions">

        <button
          class="btn secondary"
          onclick="editDocument('${doc.id}')">

          ✏️ แก้ไข

        </button>

        <button
          class="btn danger"
          onclick="deleteDocument('${doc.id}')">

          🗑️ ลบ

        </button>

      </div>

    </div>

  `;

}


/* =========================
   เอกสารทั้งหมด
========================= */

function showAllDocuments(){

  document.getElementById("search").value="";

  const list=numberedDocuments();

  document.getElementById("content").innerHTML=`

    <div class="breadcrumb">
      <span onclick="home()">หน้าแรก</span>
      / เอกสารทั้งหมด
    </div>

    <div class="toolbar">

      <div>

        <h1 class="page-title">
          📄 เอกสารทั้งหมด
        </h1>

        <p class="description">
          ${list.length} รายการ
        </p>

      </div>

      <button
        class="btn primary"
        onclick="openAddDocument()">

        ＋ ลงทะเบียนเอกสาร

      </button>

    </div>

    <div id="documentList"></div>

  `;

  renderDocumentList(list);

}


/* =========================
   ค้นหา
========================= */

function searchDocuments(){

  const q=
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();


  if(!q){

    home();

    return;

  }


  const result=
    numberedDocuments().filter(doc=>{

      const org=
        organizations.find(o=>o.id===doc.org);

      const text=[
        documentNumber(doc),
        doc.type,
        doc.subject,
        doc.project,
        doc.person,
        org ? org.name : "",
        isoToThai(doc.isoDate),
        ...(doc.files||[]).map(f=>f.name)
      ].join(" ").toLowerCase();

      return text.includes(q);

    });


  document.getElementById("content").innerHTML=`

    <div class="breadcrumb">
      ผลการค้นหา
    </div>

    <h1 class="page-title">
      🔍 ผลการค้นหา
    </h1>

    <p class="description">
      พบ ${result.length} รายการ
    </p>

    <div id="documentList"></div>

  `;

  renderDocumentList(result);

}


/* =========================
   เปิดเพิ่มเอกสาร
========================= */

function openAddDocument(orgId=""){

  document.getElementById("modalTitle").textContent=
    "➕ ลงทะเบียนเอกสาร";


  document.getElementById("docDate").value="";
  document.getElementById("docType").value="";
  document.getElementById("docOrg").value=orgId;
  document.getElementById("docProject").value="";
  document.getElementById("docSubject").value="";
  document.getElementById("docPerson").value="";
  document.getElementById("docNote").value="";
  document.getElementById("docFiles").value="";


  document.getElementById("modal").style.display="flex";

}


function closeModal(){

  document.getElementById("modal").style.display="none";

}


/* =========================
   บันทึกเอกสาร
========================= */

function saveDocument(){

  const thaiDate=
    document.getElementById("docDate").value.trim();

  const isoDate=
    thaiToISO(thaiDate);

  const type=
    document.getElementById("docType").value;

  const org=
    document.getElementById("docOrg").value;

  const project=
    document.getElementById("docProject").value.trim();

  const subject=
    document.getElementById("docSubject").value.trim();

  const person=
    document.getElementById("docPerson").value.trim();

  const note=
    document.getElementById("docNote").value.trim();


  if(!isoDate){

    alert(
      "กรุณากรอกวันที่ให้ถูกต้อง เช่น 29/09/2569"
    );

    return;

  }


  if(!type){

    alert("กรุณาเลือกประเภทบันทึกข้อความ");

    return;

  }


  if(!org){

    alert("กรุณาเลือกหน่วยงาน");

    return;

  }


  if(!project){

    alert("กรุณากรอกชื่อโครงการ");

    return;

  }


  if(!subject){

    alert("กรุณากรอกชื่อเรื่อง");

    return;

  }


  const input=
    document.getElementById("docFiles");


  const files=
    [...input.files].map(file=>({

      name:file.name,
      size:file.size,
      type:file.type

    }));


  documents.push({

    id:
      Date.now().toString(),

    seq:
      Date.now(),

    isoDate:isoDate,

    type:type,

    org:org,

    project:project,

    subject:subject,

    person:person,

    note:note,

    files:files

  });


  saveData();

  closeModal();

  showAllDocuments();

}


/* =========================
   แก้ไข
========================= */

function editDocument(id){

  const doc=
    documents.find(x=>x.id===id);

  if(!doc)return;


  document.getElementById("modalTitle").textContent=
    "✏️ แก้ไขเอกสาร";


  document.getElementById("docDate").value=
    isoToThai(doc.isoDate);

  document.getElementById("docType").value=
    doc.type;

  document.getElementById("docOrg").value=
    doc.org;

  document.getElementById("docProject").value=
    doc.project;

  document.getElementById("docSubject").value=
    doc.subject;

  document.getElementById("docPerson").value=
    doc.person || "";

  document.getElementById("docNote").value=
    doc.note || "";

  document.getElementById("docFiles").value="";


  document.getElementById("modal").style.display="flex";


  const btn=
    document.querySelector(".modal-actions .primary");

  btn.textContent="บันทึกการแก้ไข";

  btn.onclick=function(){

    const thaiDate=
      document.getElementById("docDate").value.trim();

    const isoDate=
      thaiToISO(thaiDate);


    if(!isoDate){

      alert("กรุณากรอกวันที่ให้ถูกต้อง");

      return;

    }


    doc.isoDate=isoDate;

    doc.type=
      document.getElementById("docType").value;

    doc.org=
      document.getElementById("docOrg").value;

    doc.project=
      document.getElementById("docProject").value.trim();

    doc.subject=
      document.getElementById("docSubject").value.trim();

    doc.person=
      document.getElementById("docPerson").value.trim();

    doc.note=
      document.getElementById("docNote").value.trim();


    const newFiles=
      [...document.getElementById("docFiles").files]
      .map(file=>({
        name:file.name,
        size:file.size,
        type:file.type
      }));


    if(newFiles.length){

      doc.files=[
        ...(doc.files||[]),
        ...newFiles
      ];

    }


    saveData();

    closeModal();

    btn.textContent="บันทึกเอกสาร";

    btn.onclick=saveDocument;

    showAllDocuments();

  };

}


/* =========================
   ลบ
========================= */

function deleteDocument(id){

  const doc=
    documents.find(x=>x.id===id);

  if(!doc)return;


  const ok=
    confirm(
      `ต้องการลบ ${documentNumber(doc)}\n\n${doc.subject}\n\nใช่หรือไม่?`
    );


  if(!ok)return;


  documents=
    documents.filter(x=>x.id!==id);


  saveData();

  showAllDocuments();

}


/* =========================
   เริ่มระบบ
========================= */

loadData();

setupSelects();

home();

</script>
