<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบริหารจัดการเอกสาร อวท. - วิทยาลัยเทคนิคจะนะ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Sarabun","Tahoma",sans-serif;
    background:#f4f6f9;
    color:#1f2937;
}

/* ================= HEADER ================= */

.header{
    height:78px;
    background:#071a35;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
}

.logo{
    width:52px;
    height:52px;
    object-fit:contain;
    background:white;
    border-radius:8px;
    padding:4px;
}

.brand-title{
    line-height:1.35;
}

.brand-title h1{
    font-size:20px;
    font-weight:700;
}

.brand-title p{
    font-size:13px;
    color:#d6dfec;
}

.header-search{
    width:300px;
}

.header-search input{
    width:100%;
    padding:11px 16px;
    border:none;
    outline:none;
    border-radius:25px;
    font-size:14px;
}

/* ================= LAYOUT ================= */

.layout{
    display:flex;
    min-height:calc(100vh - 78px);
}

.sidebar{
    width:245px;
    background:#fff;
    border-right:1px solid #e5e7eb;
    padding:20px 14px;
    flex-shrink:0;
}

.sidebar-title{
    font-size:12px;
    color:#8a94a6;
    font-weight:bold;
    margin:8px 12px 10px;
    text-transform:uppercase;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.menu button{
    width:100%;
    border:none;
    background:transparent;
    padding:12px 14px;
    text-align:left;
    border-radius:8px;
    cursor:pointer;
    color:#344054;
    font-size:15px;
}

.menu button:hover{
    background:#eef3f9;
    color:#071a35;
}

.menu button.active{
    background:#071a35;
    color:white;
}

.content{
    flex:1;
    padding:28px;
    min-width:0;
}

/* ================= PAGE ================= */

.page-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:22px;
}

.page-head h2{
    font-size:25px;
    color:#071a35;
}

.page-head p{
    margin-top:4px;
    color:#667085;
    font-size:14px;
}

.btn{
    border:none;
    border-radius:8px;
    padding:11px 17px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
}

.btn-primary{
    background:#071a35;
    color:white;
}

.btn-primary:hover{
    background:#102c52;
}

.btn-gold{
    background:#c59b45;
    color:white;
}

.btn-danger{
    background:#dc3545;
    color:white;
}

.btn-light{
    background:#eef2f6;
    color:#344054;
}

.btn-small{
    padding:7px 11px;
    font-size:13px;
}

/* ================= HOME ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:22px;
}

.stat-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:20px;
}

.stat-label{
    color:#667085;
    font-size:14px;
}

.stat-value{
    font-size:28px;
    color:#071a35;
    font-weight:bold;
    margin-top:6px;
}

.notice{
    background:#fff;
    border-left:5px solid #c59b45;
    padding:18px 20px;
    border-radius:8px;
    margin-bottom:25px;
}

.notice strong{
    color:#071a35;
}

.section-title{
    font-size:18px;
    color:#071a35;
    margin-bottom:14px;
}

/* ================= ORGANIZATIONS ================= */

.org-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.org-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:20px;
    cursor:pointer;
    transition:.2s;
}

.org-card:hover{
    transform:translateY(-2px);
    border-color:#c59b45;
    box-shadow:0 5px 15px rgba(0,0,0,.07);
}

.org-icon{
    width:44px;
    height:44px;
    border-radius:9px;
    background:#eef3f9;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#071a35;
    font-size:21px;
    margin-bottom:12px;
}

.org-card h3{
    font-size:15px;
    color:#071a35;
    line-height:1.5;
}

.org-card p{
    color:#8a94a6;
    font-size:13px;
    margin-top:7px;
}

/* ================= BREADCRUMB ================= */

.breadcrumb{
    display:flex;
    align-items:center;
    gap:8px;
    color:#667085;
    font-size:14px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.breadcrumb span{
    cursor:pointer;
}

.breadcrumb span:hover{
    color:#071a35;
}

.breadcrumb .current{
    color:#071a35;
    font-weight:bold;
    cursor:default;
}

/* ================= PROJECTS ================= */

.project-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:17px;
}

.project-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:20px;
    cursor:pointer;
    position:relative;
    transition:.2s;
}

.project-card:hover{
    transform:translateY(-2px);
    border-color:#c59b45;
    box-shadow:0 5px 15px rgba(0,0,0,.07);
}

.folder-icon{
    font-size:37px;
    margin-bottom:12px;
}

.project-card h3{
    color:#071a35;
    font-size:16px;
    line-height:1.5;
    padding-right:45px;
}

.project-card p{
    color:#8a94a6;
    font-size:13px;
    margin-top:8px;
}

.project-actions{
    position:absolute;
    right:12px;
    top:12px;
    display:flex;
    gap:5px;
}

/* ================= DOCUMENTS ================= */

.document-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.document-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:18px;
}

.document-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.document-number{
    color:#c08d2d;
    font-weight:bold;
    font-size:14px;
}

.document-title{
    font-size:16px;
    font-weight:bold;
    color:#071a35;
    margin-top:5px;
}

.document-meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px 18px;
    margin-top:10px;
    color:#667085;
    font-size:13px;
}

.document-files{
    margin-top:12px;
    background:#f8fafc;
    border-radius:7px;
    padding:10px 12px;
    color:#475467;
    font-size:13px;
}

.document-actions{
    display:flex;
    gap:7px;
    margin-top:14px;
}

/* ================= EMPTY ================= */

.empty{
    background:white;
    border:1px dashed #cbd5e1;
    border-radius:12px;
    padding:55px 20px;
    text-align:center;
    color:#667085;
}

.empty-icon{
    font-size:45px;
    margin-bottom:12px;
}

.empty h3{
    color:#344054;
    margin-bottom:6px;
}

/* ================= MODAL ================= */

.modal-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:13px;
    box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.modal-header{
    background:#071a35;
    color:white;
    padding:18px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h3{
    font-size:18px;
}

.close{
    background:transparent;
    border:none;
    color:white;
    font-size:25px;
    cursor:pointer;
}

.modal-body{
    padding:22px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    font-size:14px;
    font-weight:bold;
    color:#344054;
    margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid #d0d5dd;
    border-radius:7px;
    outline:none;
    font-family:inherit;
    font-size:14px;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#071a35;
}

.form-group textarea{
    resize:vertical;
    min-height:85px;
}

.modal-footer{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    padding:15px 22px;
    border-top:1px solid #e5e7eb;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){

    .org-grid,
    .project-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:1fr;
    }

    .header-search{
        width:220px;
    }
}

@media(max-width:750px){

    .header{
        height:auto;
        min-height:75px;
        padding:12px 15px;
        gap:10px;
    }

    .brand-title h1{
        font-size:16px;
    }

    .brand-title p{
        font-size:11px;
    }

    .logo{
        width:44px;
        height:44px;
    }

    .header-search{
        display:none;
    }

    .sidebar{
        width:190px;
    }

    .content{
        padding:18px;
    }

    .org-grid,
    .project-grid{
        grid-template-columns:1fr;
    }

    .page-head{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="brand" onclick="showHome()">

        <img src="logo-aft.png" class="logo" alt="โลโก้ อวท.">

        <div class="brand-title">
            <h1>ระบบบริหารจัดการเอกสาร อวท.</h1>
            <p>องค์การนักวิชาชีพในอนาคตแห่งประเทศไทย · วิทยาลัยเทคนิคจะนะ</p>
        </div>

    </div>

    <div class="header-search">
        <input
            type="text"
            id="searchInput"
            placeholder="ค้นหาเอกสาร..."
            oninput="searchDocuments()"
        >
    </div>

</header>


<div class="layout">

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="sidebar-title">เมนูหลัก</div>

    <div class="menu">

        <button id="menuHome" class="active" onclick="showHome()">
            🏠 หน้าแรก
        </button>

        <button id="menuDocuments" onclick="showAllDocuments()">
            📄 ทะเบียนเอกสาร
        </button>

        <button onclick="showOrganizations()">
            🗂 หน่วยงาน
        </button>

    </div>

</aside>


<!-- ================= CONTENT ================= -->

<main class="content" id="content"></main>

</div>


<!-- ================= MODAL PROJECT ================= -->

<div class="modal-bg" id="projectModal">

    <div class="modal">

        <div class="modal-header">

            <h3 id="projectModalTitle">เพิ่มโครงการ</h3>

            <button class="close" onclick="closeProjectModal()">×</button>

        </div>

        <div class="modal-body">

            <div class="form-group">

                <label>หน่วยงาน</label>

                <input id="projectOrgName" readonly>

            </div>

            <div class="form-group">

                <label>ชื่อโครงการ</label>

                <input
                    id="projectName"
                    placeholder="กรอกชื่อโครงการ"
                >

            </div>

            <div class="form-group">

                <label>รายละเอียด / หมายเหตุ</label>

                <textarea
                    id="projectNote"
                    placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)"
                ></textarea>

            </div>

        </div>

        <div class="modal-footer">

            <button class="btn btn-light" onclick="closeProjectModal()">
                ยกเลิก
            </button>

            <button class="btn btn-primary" onclick="saveProject()">
                บันทึกโครงการ
            </button>

        </div>

    </div>

</div>


<!-- ================= MODAL DOCUMENT ================= -->

<div class="modal-bg" id="documentModal">

    <div class="modal">

        <div class="modal-header">

            <h3 id="documentModalTitle">เพิ่มเอกสาร</h3>

            <button class="close" onclick="closeDocumentModal()">×</button>

        </div>

        <div class="modal-body">

            <div class="form-group">

                <label>หน่วยงาน</label>

                <input id="docOrgName" readonly>

            </div>

            <div class="form-group">

                <label>โครงการ</label>

                <input id="docProjectName" readonly>

            </div>

            <div class="form-group">

                <label>วันที่เอกสาร</label>

                <input
                    id="docDate"
                    placeholder="วว/ดด/2569"
                    maxlength="10"
                >

            </div>

            <div class="form-group">

                <label>ประเภทบันทึกข้อความ</label>

                <select id="docType"></select>

            </div>

            <div class="form-group">

                <label>ชื่อเรื่อง</label>

                <input
                    id="docSubject"
                    placeholder="กรอกชื่อเรื่อง"
                >

            </div>

            <div class="form-group">

                <label>ผู้ลงทะเบียน</label>

                <input
                    id="docRegistrant"
                    placeholder="กรอกชื่อผู้ลงทะเบียน"
                >

            </div>

            <div class="form-group">

                <label>ไฟล์เอกสาร</label>

                <input
                    type="file"
                    id="docFile"
                    multiple
                >

            </div>

            <div class="form-group">

                <label>หมายเหตุ</label>

                <textarea
                    id="docNote"
                    placeholder="หมายเหตุเพิ่มเติม (ถ้ามี)"
                ></textarea>

            </div>

        </div>

        <div class="modal-footer">

            <button class="btn btn-light" onclick="closeDocumentModal()">
                ยกเลิก
            </button>

            <button class="btn btn-primary" onclick="saveDocument()">
                บันทึกเอกสาร
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const START_NUMBER = 215;

const STORAGE_KEY = "aft_chana_document_drive_v1";

let currentOrg = null;
let currentProject = null;
let editingProjectId = null;
let editingDocumentId = null;


/* =========================================================
   DOCUMENT TYPES
========================================================= */

const documentTypes = [

"บันทึกข้อความขออนุมัติโครงการ",
"บันทึกข้อความขออนุญาตดำเนินโครงการ",
"บันทึกข้อความขออนุญาตประชุม",
"บันทึกข้อความขอเชิญประชุม",
"บันทึกข้อความรายงานผลการประชุม",
"บันทึกขออนุญาตลงนามในคำสั่งวิทยาลัยฯ โครงการ",
"บันทึกขออนุญาตลงนามในประกาศ อวท. โครงการ",
"บันทึกข้อความขออนุญาตประชาสัมพันธ์",
"บันทึกข้อความขออนุญาตใช้สถานที่",
"บันทึกข้อความเชิญวิทยากร",
"บันทึกข้อความขอเวลาเรียน",
"บันทึกข้อความสรุปงบประมาณการดำเนินโครงการ",
"บันทึกข้อความรายงานสรุปจำนวนผู้เข้าร่วมโครงการ",
"บันทึกข้อความรายงานผลการดำเนินโครงการ",
"บันทึกข้อความรายงานสรุปผลการดำเนินงานตามโครงการ",
"บันทึกข้อความขออนุญาตเปลี่ยนสถานที่จัดโครงการ",
"บันทึกข้อความขออนุญาตลงนามในเกียรติบัตร",
"บันทึกข้อความขอเชิญเป็นประธานเปิดโครงการ",
"บันทึกข้อความขออนุญาตผู้บังคับบัญชาพานักเรียนออกนอกสถานที่"

];


/* =========================================================
   ORGANIZATIONS
========================================================= */

const organizations = [

"องค์การนักวิชาชีพในอนาคตแห่งประเทศไทย",

"ชมรมวิชาชีพช่างไฟฟ้ากำลัง",

"ชมรมวิชาชีพช่างยนต์",

"ชมรมวิชาชีพช่างอิเล็กทรอนิกส์",

"ชมรมวิชาชีพก่อสร้าง",

"ชมรมวิชาชีพช่างเชื่อมโลหะ",

"ชมรมวิชาชีพการบัญชี",

"ชมรมวิชาชีพเทคโนโลยีธุรกิจดิจิทัล",

"ชมรมวิชาชีพศูนย์ฝึกอบรมวิชาชีพอำเภอสะเดา"

];


/* =========================================================
   STORAGE
========================================================= */

function loadData(){

    const data = localStorage.getItem(STORAGE_KEY);

    if(!data){

        return {
            projects:[],
            documents:[]
        };

    }

    try{

        const parsed = JSON.parse(data);

        return {

            projects: parsed.projects || [],
            documents: parsed.documents || []

        };

    }catch(error){

        return {
            projects:[],
            documents:[]
        };

    }

}


function saveData(data){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* =========================================================
   HOME
========================================================= */

function showHome(){

    currentOrg = null;
    currentProject = null;

    setActiveMenu("menuHome");

    const data = loadData();

    const numbered = numberedDocuments();

    let latest = "-";

    if(numbered.length){

        latest =
            "อวท." +
            documentNumber(numbered[numbered.length - 1]) +
            "/2569";

    }

    document.getElementById("content").innerHTML = `

        <div class="page-head">

            <div>
                <h2>หน้าแรก</h2>
                <p>ระบบบริหารจัดการเอกสาร อวท. วิทยาลัยเทคนิคจะนะ</p>
            </div>

        </div>


        <div class="stats">

            <div class="stat-card">

                <div class="stat-label">
                    จำนวนเอกสารทั้งหมด
                </div>

                <div class="stat-value">
                    ${data.documents.length}
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    เลขทะเบียนล่าสุด
                </div>

                <div class="stat-value" style="font-size:22px">
                    ${latest}
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    เลขทะเบียนเริ่มต้น
                </div>

                <div class="stat-value">
                    อวท.${START_NUMBER}/2569
                </div>

            </div>

        </div>


        <div class="notice">

            <strong>ระบบทะเบียนเอกสาร</strong>

            <br>

            เลขทะเบียนเอกสารเริ่มต้นที่
            <strong>อวท.${START_NUMBER}/2569</strong>

            และระบบจะจัดลำดับเลขตามวันที่เอกสาร
            โดยเอกสารที่มีวันที่เดียวกันจะเรียงตามลำดับการบันทึก

        </div>


        <div class="section-title">
            หน่วยงาน
        </div>


        <div class="org-grid">

            ${organizations.map((org,index)=>`

                <div class="org-card"
                     onclick="openOrganization(${index})">

                    <div class="org-icon">
                        ▣
                    </div>

                    <h3>
                        ${escapeHtml(org)}
                    </h3>

                    <p>
                        ${countProjects(org)} โครงการ
                    </p>

                </div>

            `).join("")}

        </div>

    `;

}

/* =========================================================
   DATE
========================================================= */

function thaiDateToISO(value){

    if(!value) return "";

    const parts =
        value.split("/");

    if(parts.length !== 3)
        return "";

    const day =
        parseInt(parts[0]);

    const month =
        parseInt(parts[1]);

    const year =
        parseInt(parts[2]);

    if(
        !day ||
        !month ||
        !year
    ) return "";

    return (
        (year - 543) +
        "-" +
        String(month).padStart(2,"0") +
        "-" +
        String(day).padStart(2,"0")
    );

}


function isoToThaiDate(value){

    if(!value) return "";

    const parts =
        value.split("-");

    if(parts.length !== 3)
        return "";

    return (

        String(parseInt(parts[2])).padStart(2,"0") +
        "/" +

        String(parseInt(parts[1])).padStart(2,"0") +
        "/" +

        (parseInt(parts[0]) + 543)

    );

}


/* =========================================================

========================================================= */

function saveDocument(){

    const dateDisplay =
        document.getElementById("docDate").value.trim();

    const dateISO =
        thaiDateToISO(dateDisplay);

    const type =
        document.getElementById("docType").value;

    const subject =
        document.getElementById("docSubject").value.trim();

    const registrant =
        document.getElementById("docRegistrant").value.trim();

        document.getElementById("docNote").value.trim();

    if(!dateISO){

        alert(
            "กรุณากรอกวันที่ในรูปแบบ วว/ดด/2569"
        );

        return;

    }

    if(!type){

        alert("กรุณาเลือกประเภทเอกสาร");

        return;

    }

    if(!subject){

        alert("กรุณากรอกชื่อเรื่อง");

        return;

    }

    const data = loadData();

    if(editingDocumentId){

        const doc =

        if(doc){

            doc.date = dateISO;
            doc.dateDisplay = dateDisplay;
            doc.type = type;
            doc.subject = subject;
            doc.registrant = registrant;
            doc.note = note;

        }

    }else{

        const fileInput =
            document.getElementById("docFile");

        const files = [];

        for(
            const file of fileInput.files
        ){

            files.push({

                name:file.name,

                size:file.size,

                type:file.type

            });

        }

        data.documents.push({

            id:
                "document_" +
                Date.now(),

            projectId:
                currentProject.id,

            organization:
                currentOrg,

            date:
                dateISO,

            dateDisplay:

            type:

            subject:

            registrant:
                registrant,

            note:
                note,

            files:
                files,

            sequence:
                Date.now(),

            createdAt:
                Date.now()

    closeDocumentModal();

    renderProjectDocuments();

/* =========================================================
   NUMBERING
========================================================= */

function numberedDocuments(){

    const data = loadData();

    return [...data.documents].sort((a,b)=>{

        const dateA =
            a.date || "9999-99-99";

        const dateB =
            b.date || "9999-99-99";

        if(dateA < dateB) return -1;

        if(dateA > dateB) return 1;

        return (
            (a.sequence || 0) -
            (b.sequence || 0)
        );

    });

}


function getCanonicalIndex(doc){

    const docs =
        numberedDocuments();

    return docs.findIndex(
        d => d.id === doc.id
    );

}


function documentNumber(doc){

    const index =
        getCanonicalIndex(doc);

    if(index < 0)
        return "-";

    return START_NUMBER + index;

}

        const element =
            document.getElementById(id);

        if(element)

    }

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    if(value === null || value === undefined)
        return "";

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
